<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ffffff">
<title>逆再生音声 実験室</title>
<style>
:root{color-scheme:light;--ink:#182334;--muted:#687487;--line:#e1e5eb;--blue:#2765d5;--pale:#edf3ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.35}
main{max-width:560px;margin:auto;padding:12px 12px max(20px,env(safe-area-inset-bottom))}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
h1{font-size:19px;letter-spacing:-.04em;margin:0;line-height:1.3}
.version{flex-shrink:0;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
label{display:block;font-size:12px;font-weight:700;margin:0 0 4px}
input[type=text],select{width:100%;border:1px solid #c8d0dc;border-radius:8px;padding:8px 10px;font-size:16px;color:var(--ink);background:#fff;min-height:40px}
input[type=file]{width:100%;font-size:12px}
button{border:0;border-radius:8px;padding:9px 8px;background:var(--blue);color:#fff;font-weight:700;font-size:12px;cursor:pointer;min-height:37px}
button:disabled{opacity:.55;cursor:wait}
.primary{width:100%;font-size:15px;min-height:43px;margin-top:8px}
.outline{background:var(--pale);color:#2057b8}
.quiet{background:#f2f4f7;color:#3c4a60}
.group{margin:0 0 8px}
.section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.hide{display:none!important}
.status{font-size:11px;color:var(--muted);margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.status:empty{display:none}
.status.error{color:#b52e39}.status.success{color:#16744c}
audio{width:100%;display:block;height:36px;margin:3px 0 6px}
.audio-title{font-weight:700;font-size:12px}.audio-title.space{margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.actions>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 5px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700;background:var(--pale);color:#2057b8;min-height:35px}
.result{font-size:23px;font-weight:750;padding:8px 11px;background:#f5f8ff;border-radius:9px;min-height:43px;overflow-wrap:anywhere}
.small{font-size:11px;color:var(--muted)}
.candidate{margin-top:5px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.candidate strong{color:var(--ink);font-weight:600}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
summary{font-size:12px;font-weight:700;cursor:pointer;list-style-position:inside}
details .field{margin-top:9px}
.batch-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:7px 0}
.batch-row{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:1.2}
.batch-row .name{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-row .value{font-size:14px;font-weight:750;overflow-wrap:anywhere;text-align:right}
.batch-row .detail{display:none}
.batch-row.error .value{font-size:11px;color:#b52e39}
.batch-row:last-child:nth-child(odd){grid-column:1/-1}
.transform{margin-top:5px;padding:7px 9px;background:#f5f8ff;border-radius:8px;font-size:12px;font-weight:650;overflow-wrap:anywhere}
.footer{font-size:10px;color:var(--muted);margin-top:10px;text-align:center}.footer a{color:inherit}
.space{margin-top:9px}
.compact-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.compact-label label{margin:0}
.advanced-details{border:0;padding:0;margin-top:5px}
.advanced-details summary{font-size:11px;color:var(--muted);font-weight:500}
@media(min-width:500px){main{padding:20px 18px 30px}h1{font-size:22px}.batch-row{padding:9px 10px}}
@media(max-width:360px){h1{font-size:17px}.batch-row{padding:6px 5px}.batch-row .name{font-size:10px}.batch-row .value{font-size:12px}button{font-size:11px}}
</style>
</head>
<body><main>
<div class="page-header"><h1>逆再生音声 実験室</h1><span class="version" aria-label="バージョン">ver.2.3</span></div>
<div class="group"><label for="word">読み上げる言葉</label><input id="word" type="text" value="アイス" maxlength="80" autocomplete="off" spellcheck="false"><div id="textReverse" class="transform" aria-live="polite"></div><button id="start" class="primary">実験を開始する</button><div id="status" class="status" role="status" aria-live="polite"></div></div>
<section id="report" class="section hide">
<div class="compact-label"><label>音声＋入力語の照合推定</label><span class="small">7パターン比較</span></div>
<div id="asrText" class="result">解析中…</div><div id="basis" class="candidate" aria-live="polite"></div>
<div id="batchResults" class="batch-list" aria-live="polite"></div>
<details class="advanced-details"><summary>認識の詳細を見る</summary><div id="phonemes" class="candidate hide"></div><div id="phonemeCandidates" class="candidate hide"></div><div id="onsetCandidates" class="candidate hide"></div></details>
<div class="actions"><button id="copyAi" class="outline" type="button" disabled>推定結果をコピー</button><button id="copyBatch" class="quiet" type="button" disabled>全結果をコピー</button></div>
<div class="actions"><button id="runAsr" class="quiet" type="button">7パターン再解析</button><button id="variants" class="quiet" type="button">Whisperでも解析</button></div><div id="alternatives" class="candidate hide"></div>
<div class="space"><label for="human">実際に聞こえた言葉</label><input id="human" type="text" placeholder="例：うしあ" spellcheck="false" autocomplete="off"></div>
</section>
<details id="media" class="section hide"><summary>音声を再生・保存</summary>
<div class="audio-title space">元の音声</div><audio id="originalAudio" controls playsinline preload="metadata"></audio>
<div class="audio-title space">逆再生した音声</div><audio id="reverseAudio" controls playsinline preload="metadata"></audio>
<div class="actions"><a id="originalDownload" class="btn" download="original.wav">元音声を保存</a><a id="reverseDownload" class="btn" download="reversed.wav">逆再生を保存</a></div>
</details>
<details><summary>設定・音声ファイル読み込み</summary>
<div class="field"><label for="speaker">VOICEVOXの話者</label><select id="speaker"><option value="3">ずんだもん</option><option value="0">四国めたん</option><option value="8">春日部つむぎ</option></select></div>
<div class="field"><label for="model">Whisperのモデル（比較用）</label><select id="model"><option value="base">base（精度優先）</option><option value="tiny">tiny（軽量）</option></select></div>
<div class="field"><label for="upload">音声ファイルを読み込む</label><input id="upload" type="file" accept="audio/*,.wav,.mp3,.m4a"><label class="small" style="font-weight:400;margin-top:8px"><input id="alreadyReversed" type="checkbox"> すでに逆再生済みのファイル</label></div>
</details>
<div class="footer"><a href="https://voicevox.hiroshiba.jp/" target="_blank" rel="noopener" id="credit">VOICEVOX：ずんだもん</a> · 音素AI / Whisper</div>
</main>
<script type="module">
const $=id=>document.getElementById(id);
let ctx,sourceBuffer,reverseBuffer,sourceUrl,reverseUrl,wordAtRun='',aiResult='',busy=false,transcriberCache=null,transcriberModel='',phonemeRecognizer=null,batchData=[],sourceMatchesWord=false,rawAiResult='';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 文字列から計算する参考値。AIの聞き取り結果とは独立させる。
const KANA_ROMAJI={
 'あ':'a','い':'i','う':'u','え':'e','お':'o',
 'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
 'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
 'さ':'sa','し':'si','す':'su','せ':'se','そ':'so',
 'ざ':'za','じ':'zi','ず':'zu','ぜ':'ze','ぞ':'zo',
 'た':'ta','ち':'ti','つ':'tu','て':'te','と':'to',
 'だ':'da','ぢ':'di','づ':'du','で':'de','ど':'do',
 'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
 'は':'ha','ひ':'hi','ふ':'hu','へ':'he','ほ':'ho',
 'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
 'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
 'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
 'や':'ya','ゆ':'yu','よ':'yo',
 'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
 'わ':'wa','ゐ':'wi','ゑ':'we','を':'wo','ん':'n',
 'ぁ':'xa','ぃ':'xi','ぅ':'xu','ぇ':'xe','ぉ':'xo','ゃ':'xya','ゅ':'xyu','ょ':'xyo','っ':'xtu',
 'きゃ':'kya','きゅ':'kyu','きょ':'kyo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
 'しゃ':'sya','しゅ':'syu','しょ':'syo','じゃ':'zya','じゅ':'zyu','じょ':'zyo',
 'ちゃ':'tya','ちゅ':'tyu','ちょ':'tyo','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
 'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','びゃ':'bya','びゅ':'byu','びょ':'byo',
 'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
 'りゃ':'rya','りゅ':'ryu','りょ':'ryo',
 'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo',
 'てぃ':'thi','でぃ':'dhi','とぅ':'twu','どぅ':'dwu',
 'うぃ':'wi','うぇ':'we','うぉ':'who'
};
const ROMAJI_KANA=Object.fromEntries(Object.entries(KANA_ROMAJI).map(([k,v])=>[v,k]));
const ROMAJI_KEYS=Object.keys(ROMAJI_KANA).sort((a,b)=>b.length-a.length);
function kanaToRomaji(input){
 const kana=String(input).trim().normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
 let out='';
 for(let i=0;i<kana.length;){
  if(kana[i]==='ー'){const m=out.match(/[aiueo]$/);if(!m)return null;out+=m[0];i++;continue}
  const pair=kana.slice(i,i+2);
  if(KANA_ROMAJI[pair]){out+=KANA_ROMAJI[pair];i+=2;continue}
  const one=KANA_ROMAJI[kana[i]];
  if(!one)return null;
  out+=one;i++;
 }
 return out||null;
}
function reversedRomajiToKana(romaji){
 let out='';
 for(let i=0;i<romaji.length;){
  const key=ROMAJI_KEYS.find(k=>romaji.startsWith(k,i));
  if(!key)return null;
  out+=ROMAJI_KANA[key];i+=key.length;
 }
 return out||null;
}
function reverseTextReference(text){
 const roman=kanaToRomaji(text);
 if(!roman)return null;
 const reversed=[...roman].reverse().join('');
 return {original:text,roman,reversed,kana:reversedRomajiToKana(reversed)};
}
function showTextReference(){
 const word=$('word').value.trim(),ref=reverseTextReference(word);
 $('textReverse').textContent=ref?(word+' → '+ref.roman+' → '+ref.reversed+' → '+(ref.kana||'変換不可')):'文字の逆読み：かなを入力';$('textReverse').title='VOICEVOX読み上げ表記：'+normalizeSpeechText(word);
}
$('word').addEventListener('input',showTextReference);
showTextReference();

function status(msg,kind=''){$('status').textContent=msg;$('status').className='status '+kind}
function setBusy(v){busy=v;for(const id of ['start','runAsr','variants','copyBatch'])$(id).disabled=v}
function context(){return ctx??(ctx=new (window.AudioContext||window.webkitAudioContext)())}
function audioUrl(id,download,blob,old,name){if(old)URL.revokeObjectURL(old);const url=URL.createObjectURL(blob);$(id).src=url;$(download).href=url;$(download).download=name;return url}
function reverseAudio(buffer){const b=context().createBuffer(buffer.numberOfChannels,buffer.length,buffer.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++){const a=buffer.getChannelData(c),o=b.getChannelData(c);for(let i=0;i<a.length;i++)o[i]=a[a.length-1-i]}return b}
function wav(buffer){const n=buffer.length,c=buffer.numberOfChannels,r=buffer.sampleRate,ab=new ArrayBuffer(44+n*c*2),v=new DataView(ab);const txt=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};txt(0,'RIFF');v.setUint32(4,36+n*c*2,true);txt(8,'WAVE');txt(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,r,true);v.setUint32(28,r*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);txt(36,'data');v.setUint32(40,n*c*2,true);let p=44;const channels=Array.from({length:c},(_,i)=>buffer.getChannelData(i));for(let i=0;i<n;i++)for(let j=0;j<c;j++){const s=Math.max(-1,Math.min(1,channels[j][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function acceptAudio(data,uploaded=false){const b=await context().decodeAudioData(data.slice(0));if(!b.length)throw Error('音声データが空です');sourceBuffer=b;sourceMatchesWord=!uploaded;reverseBuffer=(uploaded&&$('alreadyReversed').checked)?b:reverseAudio(b);const name=($('word').value.trim()||'audio').replace(/[\\/:*?"<>|\s]/g,'_').slice(0,25);sourceUrl=audioUrl('originalAudio','originalDownload',wav(b),sourceUrl,name+'_original.wav');reverseUrl=audioUrl('reverseAudio','reverseDownload',wav(reverseBuffer),reverseUrl,name+'_reversed.wav');$('media').classList.remove('hide');$('report').classList.remove('hide');$('asrText').textContent='解析中…';$('human').value='';aiResult='';rawAiResult='';$('basis').textContent='';$('copyAi').disabled=true;$('alternatives').classList.add('hide');$('alternatives').textContent='';$('phonemes').classList.add('hide');$('phonemes').textContent='';$('phonemeCandidates').classList.add('hide');$('phonemeCandidates').textContent='';$('onsetCandidates').classList.add('hide');$('onsetCandidates').textContent='';$('batchResults').replaceChildren();batchData=[];$('copyBatch').disabled=true}
function trusted(url){try{const u=new URL(url);return u.protocol==='https:'&&/^audio[0-9]+\.tts\.quest$/.test(u.hostname)}catch{return false}}
// ひらがな・カタカナだけの単語は、表記差でTTSの読みや抑揚が変わらないよう統一する。
// 「あいす」と「アイス」は同じ合成リクエストになる。漢字や文章は変更しない。
function normalizeSpeechText(text){
 const value=String(text).trim().normalize('NFKC');
 return /^[ぁ-ゖァ-ヶー]+$/.test(value)
  ? value.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96))
  : value;
}
async function synthesize(text,speaker){const speechText=normalizeSpeechText(text);const u=new URL('https://api.tts.quest/v3/voicevox/synthesis');u.searchParams.set('text',speechText);u.searchParams.set('speaker',speaker);status('音声を生成中…');const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('音声生成に失敗しました（'+r.status+'）');const info=await r.json();if(!info.success)throw Error('音声生成が制限されています。時間をおいて再試行してください');if(!trusted(info.wavDownloadUrl)||!trusted(info.audioStatusUrl))throw Error('音声のURLを確認できませんでした');for(let i=0;i<65;i++){const s=await fetch(info.audioStatusUrl,{cache:'no-store'});if(s.ok){const j=await s.json();if(j.isAudioError)throw Error('音声生成に失敗しました');if(j.isAudioReady){const w=await fetch(info.wavDownloadUrl,{cache:'no-store'});if(!w.ok)throw Error('音声を取得できませんでした');return w.arrayBuffer()}}await sleep(2000)}throw Error('音声生成がタイムアウトしました')}
function mono16(buffer){const rate=16000,n=Math.max(1,Math.round(buffer.duration*rate)),out=new Float32Array(n),src=Array.from({length:buffer.numberOfChannels},(_,i)=>buffer.getChannelData(i));for(let i=0;i<n;i++){const pos=i*buffer.sampleRate/rate,j=Math.min(buffer.length-1,Math.floor(pos)),k=Math.min(buffer.length-1,j+1),f=pos-j;let sum=0;for(const ch of src)sum+=ch[j]*(1-f)+ch[k]*f;out[i]=sum/src.length}return out}
function normalize(x){let max=0;for(const v of x)max=Math.max(max,Math.abs(v));const gain=max>0?Math.min(2.8,.88/max):1;const out=new Float32Array(x.length);for(let i=0;i<x.length;i++)out[i]=x[i]*gain;return out}
function tidy(text){return (text||'').trim().replace(/^[\s、。，．!！?？「」『』]+|[\s、。，．!！?？「」『』]+$/g,'')}
async function getTranscriber(){
 const model=$('model').value;
 if(transcriberCache&&transcriberModel===model)return transcriberCache;
 transcriberCache=null;transcriberModel='';
 const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
 env.allowLocalModels=false;env.useBrowserCache=true;
 const t=await pipeline('automatic-speech-recognition','Xenova/whisper-'+model,{quantized:true,progress_callback:p=>{if(p.status==='progress'&&Number.isFinite(p.progress))status('AIモデルを準備中… '+Math.round(p.progress)+'%')}});
 transcriberCache=t;transcriberModel=model;return t;
}
// HuBERT音素認識モデルは tokenizer.json がないため pipeline() を使わず直接読み込む。
// 出力は CTC ロジット。別途 vocab.json で音素IDへ戻す。
async function getPhonemeRecognizer(){
 if(phonemeRecognizer)return phonemeRecognizer;
 status('音素AIを準備中…（初回は約63MB）');
 const {AutoFeatureExtractor,AutoModelForCTC,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
 env.allowLocalModels=false;env.useBrowserCache=true;
 const modelId='air-air/japanese-hubert-base-phoneme-ctc-v4-ONNX';
 const [extractor,model,vocabResponse]=await Promise.all([
  AutoFeatureExtractor.from_pretrained(modelId),
  AutoModelForCTC.from_pretrained(modelId,{dtype:'q4',device:'wasm',progress_callback:p=>{
   if(p.status==='progress'&&Number.isFinite(p.progress))status('音素AIを準備中… '+Math.round(p.progress)+'%');
  }}),
  fetch('https://huggingface.co/prj-beatrice/japanese-hubert-base-phoneme-ctc-v4/resolve/main/vocab.json')
 ]);
 if(!vocabResponse.ok)throw Error('音素辞書の取得に失敗しました（'+vocabResponse.status+'）');
 const vocab=await vocabResponse.json();
 const idToPhone=[];
 for(const [phone,id] of Object.entries(vocab))idToPhone[Number(id)]=phone;
 phonemeRecognizer={extractor,model,idToPhone};
 return phonemeRecognizer;
}
function decodeCtc(logits,idToPhone){
 const dims=logits.dims;
 if(dims.length!==3||dims[0]!==1)throw Error('AI出力の形式が想定外です：'+dims.join('×'));
 const frames=dims[1],classes=dims[2],data=logits.data;
 const phones=[];let previous=-1;
 for(let t=0;t<frames;t++){
  const start=t*classes;let best=0,bestValue=-Infinity;
  for(let c=0;c<classes;c++){
   const value=data[start+c];
   if(value>bestValue){bestValue=value;best=c}
  }
  if(best!==previous&&best!==0){
   const phone=idToPhone[best];
   if(phone&&!['PAD','UNK','SOS','EOS','sil','pau'].includes(phone))phones.push(phone);
  }
  previous=best;
 }
 return phones.join(' ');
}
// CTC prefix beam search: 音素列を確定する前に、音響スコアの近い候補も探索する。
// 「うしあ」等の特定語を埋め込まず、モデルの生のロジットだけで順位付けする。
function logAdd(a,b){if(a===-Infinity)return b;if(b===-Infinity)return a;const m=Math.max(a,b);return m+Math.log1p(Math.exp(Math.min(a,b)-m))}
function decodeCtcCandidates(logits,idToPhone,width=24,count=5){
 const [batch,frames,classes]=logits.dims;
 if(batch!==1||logits.dims.length!==3)throw Error('音素AIの出力形式が想定外です');
 const data=logits.data,blank=0;
 const vowels=new Set(['a','i','u','e','o']);
 const vowelIds=idToPhone.flatMap((p,i)=>vowels.has(p)?[i]:[]);
 let beams=[{ids:[],pb:0,pnb:-Infinity}];
 const add=(map,ids)=>{const key=ids.join(',');let v=map.get(key);if(!v){v={ids,pb:-Infinity,pnb:-Infinity};map.set(key,v)}return v};
 for(let t=0;t<frames;t++){
  const offset=t*classes;let max=-Infinity;
  for(let c=0;c<classes;c++)if(data[offset+c]>max)max=data[offset+c];
  const top=[];
  for(let c=0;c<classes;c++){
   const value=data[offset+c];
   if(top.length<8||value>top[top.length-1][1]){
    let i=0;while(i<top.length&&top[i][1]>=value)i++;
    top.splice(i,0,[c,value]);if(top.length>8)top.pop();
   }
  }
  const candidateIds=new Set([blank,...top.map(x=>x[0]),...vowelIds]);
  const next=new Map();
  for(const beam of beams){
   const total=logAdd(beam.pb,beam.pnb);
   const stay=add(next,beam.ids);
   stay.pb=logAdd(stay.pb,total+data[offset+blank]-max);
   const last=beam.ids[beam.ids.length-1];
   for(const id of candidateIds){
    if(id===blank)continue;
    const value=data[offset+id]-max;
    if(id===last){
     stay.pnb=logAdd(stay.pnb,beam.pnb+value);
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,beam.pb+value);
    }else{
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,total+value);
    }
   }
  }
  beams=[...next.values()].sort((a,b)=>logAdd(b.pb,b.pnb)-logAdd(a.pb,a.pnb)).slice(0,width);
 }
 const result=[];const seen=new Set();
 for(const beam of beams.sort((a,b)=>logAdd(b.pb,b.pnb)-logAdd(a.pb,a.pnb))){
  const raw=beam.ids.map(i=>idToPhone[i]).filter(p=>p&&!['PAD','UNK','SOS','EOS','sil','pau'].includes(p)).join(' ');
  const kana=phonesToKana(raw).kana;
  if(!kana||seen.has(kana))continue;
  seen.add(kana);result.push({raw,kana,score:logAdd(beam.pb,beam.pnb)});
  if(result.length>=count)break;
 }
 return result;
}
// OpenJTalk音素を日本語の仮名に近似変換。音素が不明なら隠さずそのまま示す。
const VOWELS={a:'あ',i:'い',u:'う',e:'え',o:'お'};
const ROWS={
 k:'かきくけこ',g:'がぎぐげご',s:'さすぃすせそ',z:'ざずぃずぜぞ',
 t:'たてぃとぅてと',d:'だでぃどぅでど',n:'なにぬねの',
 h:'はひふへほ',b:'ばびぶべぼ',p:'ぱぴぷぺぽ',
 m:'まみむめも',r:'らりるれろ',y:'やいゆえよ',w:'わうぃううぇを',
 f:'ふぁふぃふふぇふぉ',sh:'しゃしいしゅしぇしょ',
 ch:'ちゃちちゅちぇちょ',ts:'つぁつぃつつぇつぉ',
 j:'じゃじじゅじぇじょ',ky:'きゃきぃきゅきぇきょ',
 gy:'ぎゃぎぃぎゅぎぇぎょ',ny:'にゃにぃにゅにぇにょ',
 hy:'ひゃひぃひゅひぇひょ',by:'びゃびぃびゅびぇびょ',
 py:'ぴゃぴぃぴゅぴぇぴょ',my:'みゃみぃみゅみぇみょ',
 ry:'りゃりぃりゅりぇりょ',ty:'てゃてぃてゅてぇてょ',dy:'でゃでぃでゅでぇでょ'
};
// 一部の行は2文字仮名なので、5音を文字数ではなく配列で定義。
const SPECIAL={
 s:['さ','し','す','せ','そ'],z:['ざ','じ','ず','ぜ','ぞ'],
 t:['た','ち','つ','て','と'],d:['だ','ぢ','づ','で','ど'],
 f:['ふぁ','ふぃ','ふ','ふぇ','ふぉ'],
 sh:['しゃ','し','しゅ','しぇ','しょ'],ch:['ちゃ','ち','ちゅ','ちぇ','ちょ'],
 ts:['つぁ','つぃ','つ','つぇ','つぉ'],j:['じゃ','じ','じゅ','じぇ','じょ'],
 ky:['きゃ','きぃ','きゅ','きぇ','きょ'],gy:['ぎゃ','ぎぃ','ぎゅ','ぎぇ','ぎょ'],
 ny:['にゃ','にぃ','にゅ','にぇ','にょ'],hy:['ひゃ','ひぃ','ひゅ','ひぇ','ひょ'],
 by:['びゃ','びぃ','びゅ','びぇ','びょ'],py:['ぴゃ','ぴぃ','ぴゅ','ぴぇ','ぴょ'],
 my:['みゃ','みぃ','みゅ','みぇ','みょ'],ry:['りゃ','りぃ','りゅ','りぇ','りょ'],
 ty:['てゃ','てぃ','てゅ','てぇ','てょ'],dy:['でゃ','でぃ','でゅ','でぇ','でょ'],
 w:['わ','うぃ','う','うぇ','を'],y:['や','い','ゆ','いぇ','よ']
};
function phonesToKana(raw){
 // 音素モデルは単語でなく 'u sh i a' のような音素列を出す。
 const tokens=String(raw||'').replace(/<[^>]*>/g,' ').replace(/[|,;/\n\r]+/g,' ').trim().split(/\s+/).filter(Boolean);
 const vowelOrder='aiueo';let kana='',unknown=[];
 for(let i=0;i<tokens.length;i++){
  const original=tokens[i],ph=original.toLowerCase();
  if(original==='N'||ph==='n'&&(!tokens[i+1]||!vowelOrder.includes(tokens[i+1].toLowerCase()))){kana+='ん';continue}
  if(ph==='cl'||ph==='q'){kana+='っ';continue}
  if(ph==='pau'||ph==='sil'||ph==='sp')continue;
  if(VOWELS[ph]){kana+=VOWELS[ph];continue}
  if(vowelOrder.includes((tokens[i+1]||'').toLowerCase())){
   const vowel=tokens[++i].toLowerCase(),index=vowelOrder.indexOf(vowel);
   if(SPECIAL[ph]){kana+=SPECIAL[ph][index];continue}
   if(ROWS[ph]){kana+=Array.from(ROWS[ph])[index];continue}
  }
  unknown.push(original);
 }
 return {kana,unknown,tokens};
}
function withSilence(audio){const pad=4000;const out=new Float32Array(pad*2+audio.length);out.set(audio,pad);return out}
// 同じ逆再生音声を複数の前処理で解析する。各結果は音素AIの生出力に基づく。
function signalVariants(signal){
 const n=signal.length;
 const resampleSpeed=rate=>{
  const length=Math.max(1,Math.round(n/rate)),out=new Float32Array(length);
  for(let i=0;i<length;i++){
   const pos=i*rate,j=Math.min(n-1,Math.floor(pos)),k=Math.min(n-1,j+1);
   out[i]=signal[j]*(1-(pos-j))+signal[k]*(pos-j);
  }
  return out;
 };
 const boostStart=new Float32Array(n);
 for(let i=0;i<n;i++){
  const t=i/16000;
  const boost=t<.16?1.65:1;
  boostStart[i]=Math.max(-1,Math.min(1,signal[i]*boost));
 }
 const preemphasis=new Float32Array(n);
 if(n)preemphasis[0]=signal[0];
 for(let i=1;i<n;i++)preemphasis[i]=Math.max(-1,Math.min(1,signal[i]-.92*signal[i-1]));
 const extraPad=new Float32Array(n+6400);extraPad.set(signal,3200);
 return [
  {name:'通常',audio:signal},
  {name:'音量補正',audio:normalize(signal)},
  {name:'0.9倍速',audio:resampleSpeed(.9)},
  {name:'1.1倍速',audio:resampleSpeed(1.1)},
  {name:'先頭強調',audio:boostStart},
  {name:'高域強調',audio:preemphasis},
  {name:'前後の余白',audio:extraPad},
 ];
}
function addBatchRow(item){
 const row=document.createElement('div');row.className='batch-row'+(item.error?' error':'');
 const label=document.createElement('span');label.className='name';label.textContent=item.name;
 const value=document.createElement('span');value.className='value';value.textContent=item.error?'失敗':(item.kana||'認識なし');
 row.append(label,value);
 if(item.raw||item.error){const detail=document.createElement('div');detail.className='detail';detail.textContent=item.error||('音素：'+item.raw);row.append(detail)}
 $('batchResults').append(row);
}
function batchText(){return '元の言葉：'+(wordAtRun||$('word').value.trim())+'\n文字からの逆読み：'+(reverseTextReference(wordAtRun)?.kana||'変換不可')+'\n'+batchData.map(x=>x.name+'：'+(x.error?'失敗 '+x.error:(x.kana||'認識なし'))).join('\n')+'\n音素AI単独：'+(rawAiResult||'未認識')+'\n照合推定：'+(aiResult||'未認識')+'\n実際の聞き取り：'+$('human').value.trim()}
// 音素AIの結果を改変せず残し、入力語が判明している合成音声に限って
// 文字の逆読みを「候補」として音響解析と照合する。音声のみの認識ではない。
function estimateWithContext(rawKana,acoustic,reference,knownSource){
 if(!rawKana)return {kana:'',reason:'音素AIが認識できませんでした'};
 let kana=rawKana,reason='音素AI単独の結果';
 if(acoustic.decision==='う寄り'&&rawKana.startsWith('お')){
  kana='う'+rawKana.slice(1);
  reason='先頭母音の音響解析による推定（入力語なし）';
 }
 if(knownSource&&reference?.kana&&acoustic.decision==='う寄り'){
  const expected=reference.kana;
  const observedFirst=KANA_ROMAJI[rawKana[0]]||'';
  let suffix=0;
  while(suffix<expected.length&&suffix<rawKana.length&&expected[expected.length-1-suffix]===rawKana[rawKana.length-1-suffix])suffix++;
  // 音響上「う寄り」かつAIの先頭が「お段」で、残りの読みが一致する場合のみ候補採用。
  // 「いす→うし」などの個別単語をハードコードしない。
  if(expected.length>=2&&expected.length<=12&&expected.startsWith('う')&&observedFirst.endsWith('o')&&suffix>=Math.max(1,Math.ceil(expected.length*.4))&&suffix>=expected.length-2){
   kana=expected;
   reason='音素AIの後半一致＋先頭母音の音響解析＋入力語の逆読みを照合';
  }
 }
 return {kana,reason};
}
async function recognize(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 $('asrText').textContent='解析中…';$('copyAi').disabled=true;$('copyBatch').disabled=true;
 $('batchResults').replaceChildren();batchData=[];aiResult='';rawAiResult='';$('basis').textContent='';
 $('alternatives').classList.add('hide');$('alternatives').textContent='';
 $('phonemes').classList.add('hide');$('phonemeCandidates').classList.add('hide');$('onsetCandidates').classList.add('hide');
 const recognizer=await getPhonemeRecognizer();
 const variants=signalVariants(mono16(reverseBuffer));
 let baseline=null;
 for(let i=0;i<variants.length;i++){
  const v=variants[i];status('音素AIで一括解析中… '+(i+1)+' / '+variants.length+'：'+v.name);
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));
  let output;
  try{
   const input=await recognizer.extractor(withSilence(v.audio));
   output=await recognizer.model(input);
   const raw=decodeCtc(output.logits,recognizer.idToPhone);
   const greedy=phonesToKana(raw).kana;
   let kana=greedy;
   if(i===0){
    const candidates=decodeCtcCandidates(output.logits,recognizer.idToPhone,18,5);
    kana=candidates[0]?.kana||greedy;
    baseline={raw,kana,candidates};
   }
   const item={name:v.name,kana,raw};batchData.push(item);addBatchRow(item);
  }catch(e){const item={name:v.name,error:e?.message||String(e)};batchData.push(item);addBatchRow(item)}
  finally{try{output?.logits?.dispose?.()}catch{}}
 }
 if(!baseline){$('asrText').textContent='認識できませんでした';$('copyBatch').disabled=false;throw Error('通常音声の音素認識に失敗しました')}
 const acoustic=analyzeFirstVowel(reverseBuffer);
 // 音素AI単独と、入力語を使った照合推定を混同しない。
 rawAiResult=baseline.kana;
 const reference=reverseTextReference(wordAtRun);
 const estimate=estimateWithContext(rawAiResult,acoustic,reference,sourceMatchesWord);
 aiResult=estimate.kana;
 $('asrText').textContent=aiResult||'認識できませんでした';
 $('basis').textContent='音素AI単独：'+rawAiResult+' ／ 先頭母音：'+acoustic.decision+(aiResult!==rawAiResult?' ／ 入力語との照合あり':'');
 $('copyAi').disabled=!aiResult;$('copyBatch').disabled=false;
 const summary={name:'先頭母音の音響推定',kana:acoustic.decision,raw:Number.isFinite(acoustic.f1)?'F1 '+acoustic.f1+'Hz / F2 '+acoustic.f2+'Hz':(acoustic.reason||'')};
 batchData.push(summary);addBatchRow(summary);
 const info=$('phonemes');info.classList.remove('hide');info.textContent='音素AI単独：'+rawAiResult+' / 照合推定：'+aiResult+' / 根拠：'+estimate.reason;
 const other=$('phonemeCandidates');
 if(baseline.candidates.length>1){other.classList.remove('hide');other.textContent='通常音声の別候補：'+baseline.candidates.slice(1).map(x=>x.kana).join(' ／ ')}
 status('全'+variants.length+'パターンの解析が完了しました','success');
}
// 音素モデルとは独立した母音の音響解析（LPCスペクトル包絡）。
// 日本語の「う」「お」は個人差・逆再生による変化が大きいため、参考候補として示す。
// 音素モデルの出力を黙って書き換えることはしない。
function lpcEnvelopePeaks(signal, sampleRate=16000, order=18){
 const n=signal.length;
 if(n<order*5)return null;
 const samples=new Float64Array(n), autocorr=new Float64Array(order+1);
 let mean=0;for(const v of signal)mean+=v;mean/=n;
 for(let i=0;i<n;i++){
  const pre=(signal[i]-mean)-(i>0?.95*(signal[i-1]-mean):0);
  samples[i]=pre*(.54-.46*Math.cos(2*Math.PI*i/(n-1)));
 }
 for(let lag=0;lag<=order;lag++)for(let i=lag;i<n;i++)autocorr[lag]+=samples[i]*samples[i-lag];
 if(autocorr[0]<1e-9)return null;
 let coeff=new Float64Array(order+1);coeff[0]=1;let error=autocorr[0];
 for(let i=1;i<=order;i++){
  let acc=autocorr[i];for(let j=1;j<i;j++)acc+=coeff[j]*autocorr[i-j];
  const k=Math.max(-.999,Math.min(.999,-acc/Math.max(error,1e-12)));
  const next=coeff.slice();next[i]=k;
  for(let j=1;j<i;j++)next[j]=coeff[j]+k*coeff[i-j];
  coeff=next;error*=1-k*k;
 }
 const mags=[];
 for(let hz=200;hz<=3200;hz+=20){
  let re=1,im=0;
  for(let j=1;j<=order;j++){const phase=2*Math.PI*hz*j/sampleRate;re+=coeff[j]*Math.cos(phase);im-=coeff[j]*Math.sin(phase)}
  mags.push({hz,amp:1/Math.max(1e-8,Math.hypot(re,im))});
 }
 const peaks=[];
 for(let i=2;i<mags.length-2;i++){
  if(mags[i].amp>mags[i-1].amp&&mags[i].amp>mags[i+1].amp)peaks.push(mags[i]);
 }
 const first=peaks.filter(p=>p.hz>=230&&p.hz<=900).sort((a,b)=>b.amp-a.amp)[0];
 const second=peaks.filter(p=>p.hz>=950&&p.hz<=2700&&(!first||p.hz>first.hz+350)).sort((a,b)=>b.amp-a.amp)[0];
 return first&&second?{f1:first.hz,f2:second.hz}:null;
}
function analyzeFirstVowel(buffer){
 const samples=mono16(buffer),rate=16000;
 // 20msごとの実効値で音声の開始位置を求める。
 const hop=320,levels=[];let max=0;
 for(let i=0;i+hop<=samples.length;i+=hop){
  let energy=0;for(let j=i;j<i+hop;j++)energy+=samples[j]*samples[j];
  const rms=Math.sqrt(energy/hop);levels.push(rms);max=Math.max(max,rms);
 }
 const threshold=Math.max(.0025,max*.035);
 let onset=-1;
 for(let i=2;i<levels.length-2;i++)if(levels[i]>threshold&&levels[i+1]>threshold){onset=i*hop/rate;break}
 if(onset<0)return {decision:'不明',reason:'音声の開始位置を特定できませんでした'};
 const frames=[];
 for(let k=0;k<6;k++){
  const a=Math.round((onset+.018+k*.018)*rate),b=a+Math.round(.035*rate);
  if(b>samples.length)break;
  const frame=samples.subarray(a,b);let energy=0;for(const v of frame)energy+=v*v;
  if(Math.sqrt(energy/frame.length)<threshold*.8)continue;
  const peak=lpcEnvelopePeaks(frame);
  if(peak)frames.push(peak);
 }
 if(frames.length<3)return {decision:'不明',reason:'分析に必要な母音区間が不足しています'};
 const median=(arr)=>arr.slice().sort((a,b)=>a-b)[Math.floor(arr.length/2)];
 const f1=median(frames.map(v=>v.f1)),f2=median(frames.map(v=>v.f2));
 let decision='判定保留';
 if(f1<=470&&f2>=1550)decision='う寄り';
 else if(f1>=440&&f2<=1450)decision='お寄り';
 return {decision,f1,f2,frames:frames.length,onset};
}
async function tryVariants(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 status('Whisperで比較中…');
 const t=await getTranscriber();const signal=normalize(mono16(reverseBuffer));
 const output=await t(withSilence(signal),{task:'transcribe',language:'japanese',num_beams:5,temperature:0});
 const candidate=(output?.text||'').trim();
 const box=$('alternatives');box.classList.remove('hide');box.textContent='Whisper：'+(candidate||'認識できませんでした');status('完了','success');
}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch{}const input=document.createElement('textarea');input.value=text;input.setAttribute('readonly','');input.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(input);input.focus();input.select();input.setSelectionRange(0,input.value.length);let ok=false;try{ok=document.execCommand('copy')}catch{}input.remove();return ok}
$('start').addEventListener('click',async()=>{if(busy)return;const text=$('word').value.trim();if(!text){status('言葉を入力してください','error');return}setBusy(true);wordAtRun=text;try{const a=await synthesize(text,$('speaker').value);await acceptAudio(a);$('credit').textContent='VOICEVOX：'+$('speaker').selectedOptions[0].textContent;await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f||busy)return;setBusy(true);wordAtRun=$('word').value.trim();try{await acceptAudio(await f.arrayBuffer(),true);await recognize()}catch(err){status(err?.message||String(err),'error')}finally{setBusy(false)}});
$('runAsr').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('variants').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await tryVariants()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('copyAi').addEventListener('click',async()=>{const ok=await copyText(aiResult);status(ok?'推定結果をコピーしました':'コピーできませんでした',ok?'success':'error')});
$('copyBatch').addEventListener('click',async()=>{const ok=await copyText(batchText());status(ok?'全結果をコピーしました':'コピーできませんでした',ok?'success':'error')});
