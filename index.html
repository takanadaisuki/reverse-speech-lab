<script type="module">
const $=id=>document.getElementById(id);

function decodeCtc(logits,idToPhone){
 const dims=logits.dims;
 if(dims.length!==3||dims[0]!==1)throw Error('AI出力の形式が想定外です：'+dims.join('×'));

 for(let t=0;t<frames;t++){
  const start=t*classes;let best=0,bestValue=-Infinity;
  for(let c=0;c<classes;c++){
   const value=data[start+c];
   if(value>bestValue){bestValue=value;best=c}
  }
  if(best!==previous&&best!==0){
   const phone=idToPhone[best];
   if(phone&&!['PAD','UNK','SOS','EOS','sil','pau'].includes(phone))phones.push(phone);
  }

// CTC prefix beam search: 音素列を確定する前に、音響スコアの近い候補も探索する。
// 「うしあ」等の特定語を埋め込まず、モデルの生のロジットだけで順位付けする。
function logAdd(a,b){if(a===-Infinity)return b;if(b===-Infinity)return a;const m=Math.max(a,b);return m+Math.log1p(Math.exp(Math.min(a,b)-m))}

 if(batch!==1||logits.dims.length!==3)throw Error('音素AIの出力形式が想定外です');

 let beams=[{ids:[],pb:0,pnb:-Infinity}];

   const value=data[offset+c];
   if(top.length<8||value>top[top.length-1][1]){

   }

   const total=logAdd(beam.pb,beam.pnb);
   const stay=add(next,beam.ids);

   for(const id of candidateIds){
    if(id===blank)continue;
    const value=data[offset+id]-max;

     stay.pnb=logAdd(stay.pnb,beam.pnb+value);
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,beam.pb+value);
    }else{
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,total+value);

function phonesToKana(raw){
 // 音素モデルは単語でなく 'u sh i a' のような音素列を出す。

  const original=tokens[i],ph=original.toLowerCase();
  if(original==='N'||ph==='n'&&(!tokens[i+1]||!vowelOrder.includes(tokens[i+1].toLowerCase()))){kana+='ん';continue}
  if(ph==='cl'||ph==='q'){kana+='っ';continue}
  if(ph==='pau'||ph==='sil'||ph==='sp')continue;
  if(VOWELS[ph]){kana+=VOWELS[ph];continue}
  if(vowelOrder.includes((tokens[i+1]||'').toLowerCase())){
   const vowel=tokens[++i].toLowerCase(),index=vowelOrder.indexOf(vowel);
   if(SPECIAL[ph]){kana+=SPECIAL[ph][index];continue}

  }else{other.classList.add('hide');other.textContent=''}
  status('完了','success');
 }catch(e){$('asrText').textContent='音素認識に失敗しました';throw Error('音素AIの実行に失敗しました。'+(e?.message||String(e)))}
}
// 音素モデルとは独立した母音の音響解析（LPCスペクトル包絡）。
// 日本語の「う」「お」は個人差・逆再生による変化が大きいため、参考候補として示す。
// 音素モデルの出力を黙って書き換えることはしない。
function lpcEnvelopePeaks(signal, sampleRate=16000, order=18){
 const n=signal.length;
 if(n<order*5)return null;
 const samples=new Float64Array(n), autocorr=new Float64Array(order+1);
 let mean=0;for(const v of signal)mean+=v;mean/=n;
 for(let i=0;i<n;i++){
  const pre=(signal[i]-mean)-(i>0?.95*(signal[i-1]-mean):0);
  samples[i]=pre*(.54-.46*Math.cos(2*Math.PI*i/(n-1)));
 }
 for(let lag=0;lag<=order;lag++)for(let i=lag;i<n;i++)autocorr[lag]+=samples[i]*samples[i-lag];
 if(autocorr[0]<1e-9)return null;
 let coeff=new Float64Array(order+1);coeff[0]=1;let error=autocorr[0];
 for(let i=1;i<=order;i++){
  let acc=autocorr[i];for(let j=1;j<i;j++)acc+=coeff[j]*autocorr[i-j];
  const k=Math.max(-.999,Math.min(.999,-acc/Math.max(error,1e-12)));
  const next=coeff.slice();next[i]=k;
  for(let j=1;j<i;j++)next[j]=coeff[j]+k*coeff[i-j];
  coeff=next;error*=1-k*k;
 }
 const mags=[];
 for(let hz=200;hz<=3200;hz+=20){
  let re=1,im=0;
  for(let j=1;j<=order;j++){const phase=2*Math.PI*hz*j/sampleRate;re+=coeff[j]*Math.cos(phase);im-=coeff[j]*Math.sin(phase)}
  mags.push({hz,amp:1/Math.max(1e-8,Math.hypot(re,im))});
 }
 const peaks=[];
 for(let i=2;i<mags.length-2;i++){
  if(mags[i].amp>mags[i-1].amp&&mags[i].amp>mags[i+1].amp)peaks.push(mags[i]);
 }
 const first=peaks.filter(p=>p.hz>=230&&p.hz<=900).sort((a,b)=>b.amp-a.amp)[0];
 const second=peaks.filter(p=>p.hz>=950&&p.hz<=2700&&(!first||p.hz>first.hz+350)).sort((a,b)=>b.amp-a.amp)[0];
 return first&&second?{f1:first.hz,f2:second.hz}:null;
}
function analyzeFirstVowel(buffer){
 const samples=mono16(buffer),rate=16000;
 // 20msごとの実効値で音声の開始位置を求める。
 const hop=320,levels=[];let max=0;
 for(let i=0;i+hop<=samples.length;i+=hop){
  let energy=0;for(let j=i;j<i+hop;j++)energy+=samples[j]*samples[j];
  const rms=Math.sqrt(energy/hop);levels.push(rms);max=Math.max(max,rms);
 }
 const threshold=Math.max(.0025,max*.035);
 let onset=-1;
 for(let i=2;i<levels.length-2;i++)if(levels[i]>threshold&&levels[i+1]>threshold){onset=i*hop/rate;break}
 if(onset<0)return {decision:'不明',reason:'音声の開始位置を特定できませんでした'};
 const frames=[];
 for(let k=0;k<6;k++){
  const a=Math.round((onset+.018+k*.018)*rate),b=a+Math.round(.035*rate);
  if(b>samples.length)break;
  const frame=samples.subarray(a,b);let energy=0;for(const v of frame)energy+=v*v;
  if(Math.sqrt(energy/frame.length)<threshold*.8)continue;
  const peak=lpcEnvelopePeaks(frame);
  if(peak)frames.push(peak);
 }
 if(frames.length<3)return {decision:'不明',reason:'分析に必要な母音区間が不足しています'};
 const median=(arr)=>arr.slice().sort((a,b)=>a-b)[Math.floor(arr.length/2)];
 const f1=median(frames.map(v=>v.f1)),f2=median(frames.map(v=>v.f2));
 let decision='判定保留';
 if(f1<=470&&f2>=1550)decision='う寄り';
 else if(f1>=440&&f2<=1450)decision='お寄り';
 return {decision,f1,f2,frames:frames.length,onset};
}
async function tryOnset(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 const box=$('onsetCandidates');box.classList.remove('hide');
 const result=analyzeFirstVowel(reverseBuffer);
 const modelText=aiResult||'未認識';
 let message='先頭母音の音響推定：'+result.decision;
 if(Number.isFinite(result.f1))message+='（F1 約'+result.f1+'Hz / F2 約'+result.f2+'Hz）';
 if(result.reason)message+=' / '+result.reason;
 // モデルが「お」で始まり、音響推定が「う寄り」の場合にだけ比較候補を示す。
 if(result.decision==='う寄り'&&modelText.startsWith('お')){
  message+='\n音響推定を考慮した別候補：う'+modelText.slice(1);
 }
 message+='\n※独立した音響推定です。AIの元の認識結果は変更しません。';
 box.textContent=message;status('母音の音響解析が完了しました','success');
}
async function tryVariants(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 status('Whisperで比較中…');
 const t=await getTranscriber();const signal=normalize(mono16(reverseBuffer));
 const output=await t(withSilence(signal),{task:'transcribe',language:'japanese',num_beams:5,temperature:0});
 const candidate=(output?.text||'').trim();
 const box=$('alternatives');box.classList.remove('hide');box.textContent='Whisper：'+(candidate||'認識できませんでした');status('完了','success');
}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch{}const input=document.createElement('textarea');input.value=text;input.setAttribute('readonly','');input.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(input);input.focus();input.select();input.setSelectionRange(0,input.value.length);let ok=false;try{ok=document.execCommand('copy')}catch{}input.remove();return ok}
$('start').addEventListener('click',async()=>{if(busy)return;const text=$('word').value.trim();if(!text){status('言葉を入力してください','error');return}setBusy(true);wordAtRun=text;try{const a=await synthesize(text,$('speaker').value);await acceptAudio(a);$('credit').textContent='VOICEVOX：'+$('speaker').selectedOptions[0].textContent;await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f||busy)return;setBusy(true);wordAtRun=$('word').value.trim();try{await acceptAudio(await f.arrayBuffer(),true);await recognize()}catch(err){status(err?.message||String(err),'error')}finally{setBusy(false)}});
$('runAsr').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('tryOnset').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await tryOnset()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('variants').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await tryVariants()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('copyAi').addEventListener('click',async()=>{status(await copyText(aiResult)?'聞き取りをコピーしました':'コピーできませんでした',aiResult?'success':'error')});
$('copy').addEventListener('click',async()=>{const s='元の言葉：'+(wordAtRun||$('word').value.trim())+'\nAI：'+(aiResult||'未認識')+'\n実際の聞き取り：'+$('human').value.trim();const ok=await copyText(s);status(ok?'コピーしました':'コピーできませんでした',ok?'success':'error')});
</script>
