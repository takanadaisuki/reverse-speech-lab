<body><main>

<details><summary>設定・音声ファイル読み込み</summary>

</main>
<script type="module">
const $=id=>document.getElementById(id);
let ctx,sourceBuffer,reverseBuffer,sourceUrl,reverseUrl,wordAtRun='',aiResult='',busy=false,transcriberCache=null,transcriberModel='',phonemeRecognizer=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function status(msg,kind=''){$('status').textContent=msg;$('status').className='status '+kind}
function setBusy(v){busy=v;for(const id of ['start','runAsr','variants','tryOnset'])$(id).disabled=v}
function context(){return ctx??(ctx=new (window.AudioContext||window.webkitAudioContext)())}
function audioUrl(id,download,blob,old,name){if(old)URL.revokeObjectURL(old);const url=URL.createObjectURL(blob);$(id).src=url;$(download).href=url;$(download).download=name;return url}
function reverseAudio(buffer){const b=context().createBuffer(buffer.numberOfChannels,buffer.length,buffer.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++){const a=buffer.getChannelData(c),o=b.getChannelData(c);for(let i=0;i<a.length;i++)o[i]=a[a.length-1-i]}return b}
function wav(buffer){const n=buffer.length,c=buffer.numberOfChannels,r=buffer.sampleRate,ab=new ArrayBuffer(44+n*c*2),v=new DataView(ab);const txt=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};txt(0,'RIFF');v.setUint32(4,36+n*c*2,true);txt(8,'WAVE');txt(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,r,true);v.setUint32(28,r*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);txt(36,'data');v.setUint32(40,n*c*2,true);let p=44;const channels=Array.from({length:c},(_,i)=>buffer.getChannelData(i));for(let i=0;i<n;i++)for(let j=0;j<c;j++){const s=Math.max(-1,Math.min(1,channels[j][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function acceptAudio(data,uploaded=false){const b=await context().decodeAudioData(data.slice(0));if(!b.length)throw Error('音声データが空です');sourceBuffer=b;reverseBuffer=(uploaded&&$('alreadyReversed').checked)?b:reverseAudio(b);const name=($('word').value.trim()||'audio').replace(/[\\/:*?"<>|\s]/g,'_').slice(0,25);sourceUrl=audioUrl('originalAudio','originalDownload',wav(b),sourceUrl,name+'_original.wav');reverseUrl=audioUrl('reverseAudio','reverseDownload',wav(reverseBuffer),reverseUrl,name+'_reversed.wav');$('media').classList.remove('hide');$('report').classList.remove('hide');$('asrText').textContent='解析中…';$('human').value='';aiResult='';$('copyAi').disabled=true;$('alternatives').classList.add('hide');$('alternatives').textContent='';$('phonemes').classList.add('hide');$('phonemes').textContent='';$('phonemeCandidates').classList.add('hide');$('phonemeCandidates').textContent='';$('onsetCandidates').classList.add('hide');$('onsetCandidates').textContent=''}
function trusted(url){try{const u=new URL(url);return u.protocol==='https:'&&/^audio[0-9]+\.tts\.quest$/.test(u.hostname)}catch{return false}}
async function synthesize(text,speaker){const u=new URL('https://api.tts.quest/v3/voicevox/synthesis');u.searchParams.set('text',text);u.searchParams.set('speaker',speaker);status('音声を生成中…');const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('音声生成に失敗しました（'+r.status+'）');const info=await r.json();if(!info.success)throw Error('音声生成が制限されています。時間をおいて再試行してください');if(!trusted(info.wavDownloadUrl)||!trusted(info.audioStatusUrl))throw Error('音声のURLを確認できませんでした');for(let i=0;i<65;i++){const s=await fetch(info.audioStatusUrl,{cache:'no-store'});if(s.ok){const j=await s.json();if(j.isAudioError)throw Error('音声生成に失敗しました');if(j.isAudioReady){const w=await fetch(info.wavDownloadUrl,{cache:'no-store'});if(!w.ok)throw Error('音声を取得できませんでした');return w.arrayBuffer()}}await sleep(2000)}throw Error('音声生成がタイムアウトしました')}
function mono16(buffer){const rate=16000,n=Math.max(1,Math.round(buffer.duration*rate)),out=new Float32Array(n),src=Array.from({length:buffer.numberOfChannels},(_,i)=>buffer.getChannelData(i));for(let i=0;i<n;i++){const pos=i*buffer.sampleRate/rate,j=Math.min(buffer.length-1,Math.floor(pos)),k=Math.min(buffer.length-1,j+1),f=pos-j;let sum=0;for(const ch of src)sum+=ch[j]*(1-f)+ch[k]*f;out[i]=sum/src.length}return out}
function normalize(x){let max=0;for(const v of x)max=Math.max(max,Math.abs(v));const gain=max>0?Math.min(2.8,.88/max):1;const out=new Float32Array(x.length);for(let i=0;i<x.length;i++)out[i]=x[i]*gain;return out}
function tidy(text){return (text||'').trim().replace(/^[\s、。，．!！?？「」『』]+|[\s、。，．!！?？「」『』]+$/g,'')}
async function getTranscriber(){
 const model=$('model').value;
 if(transcriberCache&&transcriberModel===model)return transcriberCache;
 transcriberCache=null;transcriberModel='';
 const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
 env.allowLocalModels=false;env.useBrowserCache=true;
 const t=await pipeline('automatic-speech-recognition','Xenova/whisper-'+model,{quantized:true,progress_callback:p=>{if(p.status==='progress'&&Number.isFinite(p.progress))status('AIモデルを準備中… '+Math.round(p.progress)+'%')}});
 transcriberCache=t;transcriberModel=model;return t;
}
// HuBERT音素認識モデルは tokenizer.json がないため pipeline() を使わず直接読み込む。
// 出力は CTC ロジット。別途 vocab.json で音素IDへ戻す。
async function getPhonemeRecognizer(){
 if(phonemeRecognizer)return phonemeRecognizer;
 status('音素AIを準備中…（初回は約63MB）');
 const {AutoFeatureExtractor,AutoModelForCTC,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
 env.allowLocalModels=false;env.useBrowserCache=true;
 const modelId='air-air/japanese-hubert-base-phoneme-ctc-v4-ONNX';
 const [extractor,model,vocabResponse]=await Promise.all([
  AutoFeatureExtractor.from_pretrained(modelId),
  AutoModelForCTC.from_pretrained(modelId,{dtype:'q4',device:'wasm',progress_callback:p=>{
   if(p.status==='progress'&&Number.isFinite(p.progress))status('音素AIを準備中… '+Math.round(p.progress)+'%');
  }}),
  fetch('https://huggingface.co/prj-beatrice/japanese-hubert-base-phoneme-ctc-v4/resolve/main/vocab.json')
 ]);
 if(!vocabResponse.ok)throw Error('音素辞書の取得に失敗しました（'+vocabResponse.status+'）');
 const vocab=await vocabResponse.json();
 const idToPhone=[];
 for(const [phone,id] of Object.entries(vocab))idToPhone[Number(id)]=phone;
 phonemeRecognizer={extractor,model,idToPhone};
 return phonemeRecognizer;
}
function decodeCtc(logits,idToPhone){
 const dims=logits.dims;
 if(dims.length!==3||dims[0]!==1)throw Error('AI出力の形式が想定外です：'+dims.join('×'));
 const frames=dims[1],classes=dims[2],data=logits.data;
 const phones=[];let previous=-1;
 for(let t=0;t<frames;t++){
  const start=t*classes;let best=0,bestValue=-Infinity;
  for(let c=0;c<classes;c++){
   const value=data[start+c];
   if(value>bestValue){bestValue=value;best=c}
  }
  if(best!==previous&&best!==0){
   const phone=idToPhone[best];
   if(phone&&!['PAD','UNK','SOS','EOS','sil','pau'].includes(phone))phones.push(phone);
  }
  previous=best;
 }
 return phones.join(' ');
}
// CTC prefix beam search: 音素列を確定する前に、音響スコアの近い候補も探索する。
// 「うしあ」等の特定語を埋め込まず、モデルの生のロジットだけで順位付けする。
function logAdd(a,b){if(a===-Infinity)return b;if(b===-Infinity)return a;const m=Math.max(a,b);return m+Math.log1p(Math.exp(Math.min(a,b)-m))}
function decodeCtcCandidates(logits,idToPhone,width=24,count=5){
 const [batch,frames,classes]=logits.dims;
 if(batch!==1||logits.dims.length!==3)throw Error('音素AIの出力形式が想定外です');
 const data=logits.data,blank=0;
 const vowels=new Set(['a','i','u','e','o']);
 const vowelIds=idToPhone.flatMap((p,i)=>vowels.has(p)?[i]:[]);
 let beams=[{ids:[],pb:0,pnb:-Infinity}];
 const add=(map,ids)=>{const key=ids.join(',');let v=map.get(key);if(!v){v={ids,pb:-Infinity,pnb:-Infinity};map.set(key,v)}return v};
 for(let t=0;t<frames;t++){
  const offset=t*classes;let max=-Infinity;
  for(let c=0;c<classes;c++)if(data[offset+c]>max)max=data[offset+c];
  const top=[];
  for(let c=0;c<classes;c++){
   const value=data[offset+c];
   if(top.length<8||value>top[top.length-1][1]){
    let i=0;while(i<top.length&&top[i][1]>=value)i++;
    top.splice(i,0,[c,value]);if(top.length>8)top.pop();
   }
  }
  const candidateIds=new Set([blank,...top.map(x=>x[0]),...vowelIds]);
  const next=new Map();
  for(const beam of beams){
   const total=logAdd(beam.pb,beam.pnb);
   const stay=add(next,beam.ids);
   stay.pb=logAdd(stay.pb,total+data[offset+blank]-max);
   const last=beam.ids[beam.ids.length-1];
   for(const id of candidateIds){
    if(id===blank)continue;
    const value=data[offset+id]-max;
    if(id===last){
     stay.pnb=logAdd(stay.pnb,beam.pnb+value);
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,beam.pb+value);
    }else{
     const extend=add(next,[...beam.ids,id]);
     extend.pnb=logAdd(extend.pnb,total+value);
    }
   }
  }
  beams=[...next.values()].sort((a,b)=>logAdd(b.pb,b.pnb)-logAdd(a.pb,a.pnb)).slice(0,width);
 }
 const result=[];const seen=new Set();
 for(const beam of beams.sort((a,b)=>logAdd(b.pb,b.pnb)-logAdd(a.pb,a.pnb))){
  const raw=beam.ids.map(i=>idToPhone[i]).filter(p=>p&&!['PAD','UNK','SOS','EOS','sil','pau'].includes(p)).join(' ');
  const kana=phonesToKana(raw).kana;
  if(!kana||seen.has(kana))continue;
  seen.add(kana);result.push({raw,kana,score:logAdd(beam.pb,beam.pnb)});
  if(result.length>=count)break;
 }
 return result;
}
// OpenJTalk音素を日本語の仮名に近似変換。音素が不明なら隠さずそのまま示す。
const VOWELS={a:'あ',i:'い',u:'う',e:'え',o:'お'};
const ROWS={
 k:'かきくけこ',g:'がぎぐげご',s:'さすぃすせそ',z:'ざずぃずぜぞ',
 t:'たてぃとぅてと',d:'だでぃどぅでど',n:'なにぬねの',
 h:'はひふへほ',b:'ばびぶべぼ',p:'ぱぴぷぺぽ',
 m:'まみむめも',r:'らりるれろ',y:'やいゆえよ',w:'わうぃううぇを',
 f:'ふぁふぃふふぇふぉ',sh:'しゃしいしゅしぇしょ',
 ch:'ちゃちちゅちぇちょ',ts:'つぁつぃつつぇつぉ',
 j:'じゃじじゅじぇじょ',ky:'きゃきぃきゅきぇきょ',
 gy:'ぎゃぎぃぎゅぎぇぎょ',ny:'にゃにぃにゅにぇにょ',
 hy:'ひゃひぃひゅひぇひょ',by:'びゃびぃびゅびぇびょ',
 py:'ぴゃぴぃぴゅぴぇぴょ',my:'みゃみぃみゅみぇみょ',
 ry:'りゃりぃりゅりぇりょ',ty:'てゃてぃてゅてぇてょ',dy:'でゃでぃでゅでぇでょ'
};
// 一部の行は2文字仮名なので、5音を文字数ではなく配列で定義。
const SPECIAL={
 s:['さ','し','す','せ','そ'],z:['ざ','じ','ず','ぜ','ぞ'],
 t:['た','ち','つ','て','と'],d:['だ','ぢ','づ','で','ど'],
 f:['ふぁ','ふぃ','ふ','ふぇ','ふぉ'],
 sh:['しゃ','し','しゅ','しぇ','しょ'],ch:['ちゃ','ち','ちゅ','ちぇ','ちょ'],
 ts:['つぁ','つぃ','つ','つぇ','つぉ'],j:['じゃ','じ','じゅ','じぇ','じょ'],
 ky:['きゃ','きぃ','きゅ','きぇ','きょ'],gy:['ぎゃ','ぎぃ','ぎゅ','ぎぇ','ぎょ'],
 ny:['にゃ','にぃ','にゅ','にぇ','にょ'],hy:['ひゃ','ひぃ','ひゅ','ひぇ','ひょ'],
 by:['びゃ','びぃ','びゅ','びぇ','びょ'],py:['ぴゃ','ぴぃ','ぴゅ','ぴぇ','ぴょ'],
 my:['みゃ','みぃ','みゅ','みぇ','みょ'],ry:['りゃ','りぃ','りゅ','りぇ','りょ'],
 ty:['てゃ','てぃ','てゅ','てぇ','てょ'],dy:['でゃ','でぃ','でゅ','でぇ','でょ'],
 w:['わ','うぃ','う','うぇ','を'],y:['や','い','ゆ','いぇ','よ']

function phonesToKana(raw){
 // 音素モデルは単語でなく 'u sh i a' のような音素列を出す。
 const tokens=String(raw||'').replace(/<[^>]*>/g,' ').replace(/[|,;/\n\r]+/g,' ').trim().split(/\s+/).filter(Boolean);
 const vowelOrder='aiueo';let kana='',unknown=[];
 for(let i=0;i<tokens.length;i++){
  const original=tokens[i],ph=original.toLowerCase();
  if(original==='N'||ph==='n'&&(!tokens[i+1]||!vowelOrder.includes(tokens[i+1].toLowerCase()))){kana+='ん';continue}
  if(ph==='cl'||ph==='q'){kana+='っ';continue}
  if(ph==='pau'||ph==='sil'||ph==='sp')continue;
  if(VOWELS[ph]){kana+=VOWELS[ph];continue}
  if(vowelOrder.includes((tokens[i+1]||'').toLowerCase())){
   const vowel=tokens[++i].toLowerCase(),index=vowelOrder.indexOf(vowel);
   if(SPECIAL[ph]){kana+=SPECIAL[ph][index];continue}
   if(ROWS[ph]){kana+=Array.from(ROWS[ph])[index];continue}
  }
  unknown.push(original);
 }

}
function withSilence(audio){const pad=4000;const out=new Float32Array(pad*2+audio.length);out.set(audio,pad);return out}
async function recognize(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 status('音素AIで解析中…');$('asrText').textContent='解析中…';$('copyAi').disabled=true;aiResult='';
 $('alternatives').classList.add('hide');$('alternatives').textContent='';
 try{
  const recognizer=await getPhonemeRecognizer();
  const input=await recognizer.extractor(withSilence(mono16(reverseBuffer)));
  const output=await recognizer.model(input);
  const raw=decodeCtc(output.logits,recognizer.idToPhone);
  const candidates=decodeCtcCandidates(output.logits,recognizer.idToPhone);
  output.logits.dispose?.();
  const decoded=phonesToKana(raw);
  // 主表示はビーム探索の最高スコア候補。従来の単純な最大値列も参考として残す。
  aiResult=candidates[0]?.kana||decoded.kana;
  $('asrText').textContent=aiResult||'音素を認識できませんでした';
  $('copyAi').disabled=!aiResult;
  const box=$('phonemes');box.classList.remove('hide');
  box.textContent='単純認識の音素：'+(raw||'（なし）')+(decoded.unknown.length?' / 未変換：'+decoded.unknown.join(' '):'');
  const other=$('phonemeCandidates');
  if(candidates.length>1){
   other.classList.remove('hide');
   other.textContent='音響的に近い候補：'+candidates.slice(1).map(c=>c.kana).join(' ／ ');
  }else{other.classList.add('hide');other.textContent=''}
  status('完了','success');
 }catch(e){$('asrText').textContent='音素認識に失敗しました';throw Error('音素AIの実行に失敗しました。'+(e?.message||String(e)))}
}
// 逆再生の先頭にある弱い母音を強調する実験。
// 特定の単語や期待する読みを参照せず、実際の音響データを加工して同じモデルに再入力する。
function enhanceOnset(signal){
 const out=new Float32Array(signal.length);let peak=0;
 for(let i=0;i<signal.length;i++){
  const t=i/16000;
  // 0.10〜0.34秒付近の弱い音を強調し、0.46秒までに元の音量に戻す。
  const gain=t<.10?1.0:t<.16?1+1.7*(t-.10)/.06:t<.34?2.7:t<.46?1+1.7*(.46-t)/.12:1;
  out[i]=signal[i]*gain;peak=Math.max(peak,Math.abs(out[i]));
 }
 const scale=peak>.95?.95/peak:1;
 if(scale!==1)for(let i=0;i<out.length;i++)out[i]*=scale;
 return out;
}
async function tryOnset(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 const box=$('onsetCandidates');box.classList.remove('hide');box.textContent='先頭音を解析中…';
 const recognizer=await getPhonemeRecognizer();
 const base=mono16(reverseBuffer),enhanced=enhanceOnset(base);
 const versions=[['先頭音を強調',enhanced],['先頭の無音を短縮',enhanced.subarray(Math.min(Math.floor(.075*16000),Math.floor(enhanced.length*.12)))]];
 const lines=[];
 for(const [label,signal] of versions){
  status(label+'して認識中…');
  const input=await recognizer.extractor(withSilence(signal));
  const output=await recognizer.model(input);
  try{
   const candidates=decodeCtcCandidates(output.logits,recognizer.idToPhone,24,3);
   const raw=decodeCtc(output.logits,recognizer.idToPhone);
   const kana=candidates[0]?.kana||phonesToKana(raw).kana||'認識できませんでした';
   const others=candidates.slice(1).map(c=>c.kana);
   lines.push(label+'：'+kana+(others.length?'（別候補：'+others.join(' ／ ')+'）':''));
   box.textContent=lines.join('\n');
  }finally{output.logits.dispose?.()}
 }
 status('先頭音の再解析が完了しました','success');
}
async function tryVariants(){
 if(!reverseBuffer)throw Error('先に音声を作成してください');
 status('Whisperで比較中…');
 const t=await getTranscriber();const signal=normalize(mono16(reverseBuffer));
 const output=await t(withSilence(signal),{task:'transcribe',language:'japanese',num_beams:5,temperature:0});
 const candidate=(output?.text||'').trim();
 const box=$('alternatives');box.classList.remove('hide');box.textContent='Whisper：'+(candidate||'認識できませんでした');status('完了','success');
}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch{}const input=document.createElement('textarea');input.value=text;input.setAttribute('readonly','');input.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(input);input.focus();input.select();input.setSelectionRange(0,input.value.length);let ok=false;try{ok=document.execCommand('copy')}catch{}input.remove();return ok}
$('start').addEventListener('click',async()=>{if(busy)return;const text=$('word').value.trim();if(!text){status('言葉を入力してください','error');return}setBusy(true);wordAtRun=text;try{const a=await synthesize(text,$('speaker').value);await acceptAudio(a);$('credit').textContent='VOICEVOX：'+$('speaker').selectedOptions[0].textContent;await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f||busy)return;setBusy(true);wordAtRun=$('word').value.trim();try{await acceptAudio(await f.arrayBuffer(),true);await recognize()}catch(err){status(err?.message||String(err),'error')}finally{setBusy(false)}});
$('runAsr').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await recognize()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('tryOnset').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await tryOnset()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('variants').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{await tryVariants()}catch(e){status(e?.message||String(e),'error')}finally{setBusy(false)}});
$('copyAi').addEventListener('click',async()=>{status(await copyText(aiResult)?'聞き取りをコピーしました':'コピーできませんでした',aiResult?'success':'error')});
$('copy').addEventListener('click',async()=>{const s='元の言葉：'+(wordAtRun||$('word').value.trim())+'\nAI：'+(aiResult||'未認識')+'\n実際の聞き取り：'+$('human').value.trim();const ok=await copyText(s);status(ok?'コピーしました':'コピーできませんでした',ok?'success':'error')});
